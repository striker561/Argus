# argus.yaml — copy this file to argus.yaml and edit it.
# Argus reads ./argus.yaml from the current working directory, or the path in
# the ARGUS_CONFIG_PATH environment variable when set.

# --- Minimal ---
connections:
  - name: my-app
    redis_url: redis://localhost:6379/0
    stack: laravel

